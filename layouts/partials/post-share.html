{{ $url := .Permalink | absLangURL | urlquery }}
{{ $title := .Title | urlquery }}
<div class="social-share pt-4" aria-labelledby="share-heading">
	<h4 id="share-heading">{{ i18n "share" }}:</h4>

	<a class="resp-sharing-button__link" href="https://www.facebook.com/sharer/sharer.php?u={{ $url | safeURL }}"
		target="_blank" rel="noopener" aria-label="Share this article on Facebook" title="Share on Facebook">
		<span class="resp-sharing-button resp-sharing-button--facebook resp-sharing-button--small">
			<span aria-hidden="true" class="resp-sharing-button__icon resp-sharing-button__icon--solid">
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18.77 7.46H14.5v-1.9c0-.9.6-1.1 1-1.1h3V.5h-4.33C10.24.5 9.5 3.44 9.5 5.32v2.15h-3v4h3v12h5v-12h3.85l.42-4z" /></svg>
			</span>
		</span>
	</a>

	<a class="resp-sharing-button__link" href="https://x.com/intent/post?text={{ $title | safeURL }}&amp;url={{ $url | safeURL }}"
		target="_blank" rel="noopener" aria-label="Share this article on X" title="Share on X">
		<span class="resp-sharing-button resp-sharing-button--x resp-sharing-button--small">
			<span aria-hidden="true" class="resp-sharing-button__icon resp-sharing-button__icon--solid">
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z" /></svg>
			</span>
		</span>
	</a>

	<a class="resp-sharing-button__link" href="https://www.linkedin.com/sharing/share-offsite/?url={{ $url | safeURL }}"
		target="_blank" rel="noopener" aria-label="Share this article on LinkedIn" title="Share on LinkedIn">
		<span class="resp-sharing-button resp-sharing-button--linkedin resp-sharing-button--small">
			<span aria-hidden="true" class="resp-sharing-button__icon resp-sharing-button__icon--solid">
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V8.98h3.42v1.57h.05c.48-.9 1.64-1.85 3.37-1.85 3.61 0 4.28 2.38 4.28 5.47v6.28zM5.32 7.41a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.1 20.45H3.54V8.98H7.1v11.47z" /></svg>
			</span>
		</span>
	</a>

	<a class="resp-sharing-button__link" href="mailto:?subject={{ $title | safeURL }}&amp;body={{ $url | safeURL }}"
		aria-label="Share this article by email" title="Share by email">
		<span class="resp-sharing-button resp-sharing-button--email resp-sharing-button--small">
			<span aria-hidden="true" class="resp-sharing-button__icon resp-sharing-button__icon--solid">
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M22 4H2C.9 4 0 4.9 0 6v12c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-10 9.4L3.5 7.9V6.7l8.5 5.5 8.5-5.5v1.2L12 13.4z" /></svg>
			</span>
		</span>
	</a>

	<a class="resp-sharing-button__link" href="https://wa.me/?text={{ $title | safeURL }}%20{{ $url | safeURL }}"
		target="_blank" rel="noopener" aria-label="Share this article on WhatsApp" title="Share on WhatsApp">
		<span class="resp-sharing-button resp-sharing-button--whatsapp resp-sharing-button--small">
			<span aria-hidden="true" class="resp-sharing-button__icon resp-sharing-button__icon--solid">
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20.1 3.9A11.3 11.3 0 0 0 2.2 17.5L.6 23.4l6-1.6A11.4 11.4 0 1 0 20.1 3.9zM12 21.4c-1.7 0-3.3-.5-4.8-1.3l-.4-.2-3.5 1 1-3.4L4 17a9.4 9.4 0 1 1 8 4.4zm5.1-7.1c-.3-.1-1.7-.9-1.9-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.1-.2.2-.3.2-.6.1s-1.2-.5-2.3-1.4c-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6s.3-.3.4-.5c.2-.1.3-.3.4-.5.1-.2 0-.4 0-.5C10 9 9.3 7.6 9 7c-.1-.4-.4-.3-.5-.3h-.6s-.4.1-.7.3c-.3.3-1 1-1 2.4s1 2.8 1.1 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.3-.3-.4-.6-.5z" /></svg>
			</span>
		</span>
	</a>
</div>
