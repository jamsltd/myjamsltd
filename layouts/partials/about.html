{{ $data := index site.Data site.Language.Lang }}
{{ if $data.about.about.enable }}{{ with $data.about.about }}
<section class="section research-intro" id="about" aria-labelledby="about-title">
  <div class="container research-grid">
    <h2 id="about-title">{{ .title }}</h2>
    <div><p>{{ .content | markdownify }}</p><a class="text-link" href="{{ .link }}">{{ .link_label }} <span aria-hidden="true">↗</span></a></div>
  </div>
</section>
{{ end }}{{ end }}
