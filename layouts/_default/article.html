<article class="col-lg-4 col-md-6 col-12 d-flex clearfix wow fadeInUp mb-4" data-wow-duration="500ms">
  <div class="post-block">
    <div class="media-wrapper{{ if .Params.logo_image }} logo-image{{ end }}">
      {{ partial "image.html" (dict "Src" .Params.Image_webp "Alt" "Image" "Class" "img-fluid lozad") }}
    </div>

    <div class="content">
      <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
      <div class="post-summary">{{ .Summary }}</div>
      <a class="btn btn-transparent" href="{{ .Permalink }}">{{ i18n "readMore" }}</a>
    </div>
  </div>
</article>
