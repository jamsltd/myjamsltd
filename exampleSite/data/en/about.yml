about:
  enable : true
  title : About MyJAMS
  about_item :
  - icon : ti-ruler-pencil # themify icon pack : https://themify.me/themify-icons
    title : Research translation
    content : MyJAMS Ltd was founded to translate the Augmented Reality Music Ensemble research programme into practical rehearsal, training, and immersive performance technologies.
    
  - icon : ti-music-alt # themify icon pack : https://themify.me/themify-icons
    title : Practice music together
    content : Our systems let performers rehearse with virtual musicians that adapt to timing, interpretation, and musical context, supporting solo practice, ensemble preparation, teaching, and creative production.

  - icon : ti-light-bulb # themify icon pack : https://themify.me/themify-icons
    title : Human-AI collaboration
    content : We build AI collaborators for creative rehearsal and performance, combining immersive media, avatar animation, sound generation, and real-time interaction.
