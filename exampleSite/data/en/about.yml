  title: From research to rehearsal
  content: MyJAMS is a Birmingham-based creative technology company building on the University of Birmingham’s [Augmented Reality Music Ensemble (ARME)](https://arme-project.co.uk/) research programme. Our CreaTech Frontiers-funded project, Augmented Ensemble, is developing and evaluating responsive virtual musicians for group musical practice.
